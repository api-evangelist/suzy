name: Suzy
description: >-
  Suzy is an AI-driven consumer insights platform that unifies quantitative surveys
  (Suzy Insights), qualitative research (moderated Suzy Live IDIs and AI-moderated
  Suzy Speaks voice interviews), real-time cultural trend intelligence (Suzy Signals),
  and on-demand access to 1M+ verified consumers protected by BIOTIC fraud detection
  (Suzy Audiences). Its AI Suite adds screeners, summaries, themeing, and predictive
  heatmaps so enterprise brand, product, marketing, shopper, and insights teams can
  validate ideas and move at the speed of culture. Surfaced as a foundry-group
  portfolio company and enriched from public web sources; Suzy publishes no public
  developer API surface.
